services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: jungle
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/000002_api_financial_guarantees.up.sql:/docker-entrypoint-initdb.d/002_api_financial_guarantees.sql:ro
      - ./migrations/000003_inbox_consumer_identity.up.sql:/docker-entrypoint-initdb.d/003_inbox_consumer_identity.sql:ro
      - ./migrations/000004_outbox_claim_lease.up.sql:/docker-entrypoint-initdb.d/004_outbox_claim_lease.sql:ro
      - ./migrations/000005_pending_reference_retry.up.sql:/docker-entrypoint-initdb.d/005_pending_reference_retry.sql:ro
      - ./migrations/000006_financial_constraints.up.sql:/docker-entrypoint-initdb.d/006_financial_constraints.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"] 
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: "http://keycloak:8080"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - "./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro"
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-transactions.fifo >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://jungle:jungle@postgres:5432/jungle?sslmode=disable"
      LOG_LEVEL: DEBUG
      TRACE_ID: traceId
      OIDC_ISSUER: "http://keycloak:8080/realms/jungle"
      OIDC_AUDIENCE: jungle-api
      OIDC_INTERNAL_ROLE: wallet-internal
      AWS_REGION: us-east-1
      SQS_ENDPOINT_URL: "http://localstack:4566"
      SQS_WAGER_QUEUE_URL: "http://localstack:4566/000000000000/wager-transactions.fifo"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      localstack:
        condition: service_healthy
    networks:
      - backend

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: consumer
    environment:
      DATABASE_URL: "postgres://jungle:jungle@postgres:5432/jungle?sslmode=disable"
      AWS_REGION: us-east-1
      SQS_ENDPOINT_URL: "http://localstack:4566"
      SQS_WAGER_QUEUE_URL: "http://localstack:4566/000000000000/wager-transactions.fifo"
      VISIBILITY_TIMEOUT: 30s
      SQS_WAIT_TIME: 20s
      SQS_MAX_MESSAGES: 10
      RETRY_BASE: 1s
      RETRY_MAX: 1m
      CONSUMER_NAME: wager-consumer
      LOG_LEVEL: DEBUG
      TRACE_ID: traceId
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - backend

  publisher:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: publisher
    environment:
      DATABASE_URL: "postgres://jungle:jungle@postgres:5432/jungle?sslmode=disable"
      AWS_REGION: us-east-1
      SQS_ENDPOINT_URL: "http://localstack:4566"
      SQS_EVENTS_QUEUE_URL: "http://localstack:4566/000000000000/jungle-events"
      OUTBOX_BATCH_SIZE: 100
      PUBLISHER_NAME: outbox-publisher
      POLL_INTERVAL: 1s
      PUBLISHER_LEASE: 30s
      RETRY_BASE: 1s
      RETRY_MAX: 1m
      SQS_EVENT_GROUP_ID: outbox-events
      LOG_LEVEL: DEBUG
      TRACE_ID: traceId
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - backend

  reference-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: reference-worker
    environment:
      DATABASE_URL: "postgres://jungle:jungle@postgres:5432/jungle?sslmode=disable"
      POLL_INTERVAL: 1s
      REFERENCE_BATCH_SIZE: 10
      REFERENCE_TTL: 15m
      REFERENCE_MAX_ATTEMPTS: 10
      REFERENCE_RETRY_BASE: 1s
      REFERENCE_RETRY_MAX: 1m
      LOG_LEVEL: DEBUG
      TRACE_ID: traceId
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  swagger:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: swagger
    environment:
      SWAGGER_ADDR: ":8080"
    ports:
      - "8082:8080"
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
