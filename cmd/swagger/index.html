  <body>
    <div id="swagger-ui"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/3.19.5/swagger-ui-bundle.js"> </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/3.19.5/swagger-ui-standalone-preset.js"> </script>
    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"></script>
    <script>
      window.onload = function() {
        const ui = SwaggerUIBundle({
          spec: spec,
          dom_id: '#swagger-ui',
          deepLinking: true,
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset
          ],
          plugins: [
            SwaggerUIBundle.plugins.DownloadUrl
          ],
          layout: "StandaloneLayout"
        })
     
        window.ui = ui
      }

      $(document).ready(function () {
        const DOMAIN_CLASS_LIST = {
            'http://localhost:8081': 'keycloak-api',
            'http://localhost:8080': 'main-api',
        };

        const KEYCLOAK_TAG_ID = 'operations-tag-Authentication%20-%20Keycloak';

        function applyServerFilter() {
            const sections = $('.wrapper > section > div > span');
            const serverSelect = $('.servers > label > select');

            if (!sections.length || !serverSelect.length) {
                window.setTimeout(applyServerFilter, 100);
                return;
            }

            sections.each(function (elIndex, elParent) {
                const tagId = $(elParent)
                    .children('.opblock-tag-section')
                    .children('h4')
                    .attr('id');

                if (tagId === KEYCLOAK_TAG_ID) {
                    $(elParent).addClass('keycloak-api');
                } else {
                    $(elParent).addClass('main-api');
                }
            });

            const showClass = DOMAIN_CLASS_LIST[serverSelect.val()] || 'main-api';

            sections.hide();
            $('.' + showClass).show();
        }

        $(document).on('change', '.servers > label > select', function () {
            applyServerFilter();
        });

        applyServerFilter();
      });
  </script>
  </body>
